# ============================================================
# Kitty config for Yoavs
# Nord-inspired, transparent, clean Niri setup
# ============================================================


# --------------------
# Font
# --------------------

# If you later install JetBrainsMono Nerd Font, uncomment:
font_family JetBrainsMono Nerd Font
font_size 12.0


# --------------------
# Window appearance
# --------------------

background_opacity 0.88

window_padding_width 10

# Do not ask before closing the Kitty OS window
confirm_os_window_close 0

# Keep decorations minimal, Niri handles the window appearance
hide_window_decorations yes


# --------------------
# Nord colors
# --------------------

foreground #D8DEE9
background #2E3440

selection_foreground #2E3440
selection_background #88C0D0

cursor #D8DEE9
cursor_text_color #2E3440


# Normal colors
color0  #3B4252
color1  #BF616A
color2  #A3BE8C
color3  #EBCB8B
color4  #81A1C1
color5  #B48EAD
color6  #88C0D0
color7  #E5E9F0

# Bright colors
color8  #4C566A
color9  #BF616A
color10 #A3BE8C
color11 #EBCB8B
color12 #81A1C1
color13 #B48EAD
color14 #8FBCBB
color15 #ECEFF4


# --------------------
# Cursor
# --------------------

cursor_shape block

cursor_blink_interval 0.5


# --------------------
# Scrollback
# --------------------

scrollback_lines 10000

wheel_scroll_multiplier 3.0

touch_scroll_multiplier 1.0


# --------------------
# Shell integration
# --------------------

shell_integration enabled


# --------------------
# Tabs
# --------------------

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round

tab_bar_margin_width 5
tab_bar_margin_height 5 2

active_tab_foreground #2E3440
active_tab_background #88C0D0
active_tab_font_style bold

inactive_tab_foreground #D8DEE9
inactive_tab_background #3B4252
inactive_tab_font_style normal

tab_bar_background #2E3440


# --------------------
# URLs
# --------------------

url_color #88C0D0

url_style single


# --------------------
# Bell
# --------------------

enable_audio_bell no

visual_bell_duration 0.0


# --------------------
# Mouse
# --------------------

mouse_hide_wait 3.0

copy_on_select no


# --------------------
# Window title
# --------------------

dynamic_title yes


# --------------------
# Useful Kitty shortcuts
# --------------------

# New tab
map ctrl+shift+t new_tab

# Close current tab
map ctrl+shift+w close_tab

# Next/previous tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

# New Kitty window
map ctrl+shift+enter new_window

# Copy / paste
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Increase/decrease font
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0